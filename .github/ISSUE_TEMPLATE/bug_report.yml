name: Reportar un error
description: Algo del plugin no funciona como debería.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Gracias por reportarlo. **No pegues claves de API, tokens ni datos de clientes.**"
  - type: input
    id: plugin-version
    attributes:
      label: Versión del plugin
      description: El campo `version` de `.claude-plugin/plugin.json`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Versión de Claude Code
      description: Salida de `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Comando o agente involucrado
      placeholder: "/entregar, qa, scripts/nuevo-cliente.mjs…"
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Mensajes de error o salida
      render: shell
